<!DOCTYPE html>
<html lang="nl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RekenHub – Gratis Online Calculators (NL / FR / EN)</title>
    <meta name="description" content="Snelle, nauwkeurige en gratis calculators voor financiën, werk, wonen, energie, auto en gezondheid. Beschikbaar in Nederlands, Frans en Engels.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; }
        section { scroll-margin-top: 90px; }
    </style>
</head>
<body class="flex flex-col min-h-screen antialiased">
    <div id="app-header"></div>

    <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 sm:py-10 flex-grow space-y-10">

        <!-- Hero & Snelle Zoekbalk -->
        <div class="bg-white rounded-3xl p-6 sm:p-10 border border-slate-200/90 shadow-2xs relative overflow-hidden">
            <div class="absolute -right-16 -top-16 w-64 h-64 bg-blue-50 rounded-full blur-2xl opacity-70 pointer-events-none"></div>
            <div class="relative z-10 flex flex-col lg:flex-row lg:items-center justify-between gap-6">
                <div class="max-w-xl space-y-2">
                    <span id="hero-badge" class="inline-flex items-center gap-1.5 text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                        100% Gratis • Direct in je browser
                    </span>
                    <h1 id="hero-title" class="font-heading text-3xl sm:text-4xl font-bold text-slate-900">
                        Slimme Calculators voor Elke Dag
                    </h1>
                    <p id="hero-subtitle" class="text-slate-500 text-sm sm:text-base leading-relaxed">
                        Van hypotheek en spaarrente tot laadkosten en vierkante meters — direct berekend voor België, Nederland en Luxemburg.
                    </p>
                </div>

                <div class="w-full lg:w-80 shrink-0 space-y-2">
                    <div class="relative">
                        <input type="text" id="search-input" onkeyup="renderBento()" placeholder="Zoek calculator (bijv. btw, werkuren, m²)..." class="w-full rounded-2xl border border-slate-300 bg-slate-50/80 focus:bg-white pl-11 pr-4 py-3 text-sm font-medium text-slate-800 focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition">
                        <svg class="w-4 h-4 text-slate-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <div id="quick-pills" class="flex flex-wrap gap-1.5 text-[11px] font-semibold text-slate-500"></div>
                </div>
            </div>
        </div>

        <!-- Creatief Bento-Raster met Custom Vector Illustraties -->
        <div id="bento-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <!-- Geen resultaten -->
        <div id="no-results" class="hidden text-center py-12 bg-white rounded-3xl border border-slate-200">
            <p id="no-results-text" class="font-semibold text-slate-700">Geen calculator gevonden.</p>
            <button id="reset-search-btn" onclick="document.getElementById('search-input').value=''; renderBento();" class="mt-2 text-sm font-bold text-blue-600 hover:underline">Toon alle calculators</button>
        </div>

    </main>

    <div id="app-footer"></div>
    <script src="layout.js"></script>
    <script>
        const pageCopy = {
            nl: {
                badge: "100% Gratis • Direct in je browser",
                title: "Slimme Calculators voor Elke Dag",
                subtitle: "Van hypotheek en spaarrente tot laadkosten en vierkante meters — direct berekend voor België, Nederland en Luxemburg.",
                placeholder: "Zoek calculator (bijv. btw, werkuren, m²)...",
                noResults: "Geen calculator gevonden voor deze zoekterm.",
                resetBtn: "Toon alle 15 calculators",
                openLabel: "Open tool",
                soonLabel: "Binnenkort",
                pills: ["BTW 21%", "Sparen", "Hypotheek", "Laadkosten", "BMI"]
            },
            fr: {
                badge: "100% Gratuit • Direct dans le navigateur",
                title: "Calculateurs Intelligents au Quotidien",
                subtitle: "Du prêt hypothécaire et de l'épargne aux coûts de recharge et surfaces — calculés pour la Belgique, les Pays-Bas et le Luxembourg.",
                placeholder: "Rechercher (ex. TVA, heures, m²)...",
                noResults: "Aucun calculateur trouvé pour cette recherche.",
                resetBtn: "Afficher les 15 calculateurs",
                openLabel: "Ouvrir",
                soonLabel: "Bientôt",
                pills: ["TVA 21%", "Épargne", "Hypothèque", "Recharge VE", "IMC"]
            },
            en: {
                badge: "100% Free • Instant Browser Tools",
                title: "Smart Calculators for Everyday Decisions",
                subtitle: "From mortgages and compound interest to EV charging costs and square meters — fast, private, and accurate.",
                placeholder: "Search calculator (e.g. VAT, mortgage, BMI)...",
                noResults: "No calculator found matching your search.",
                resetBtn: "Show all 15 calculators",
                openLabel: "Open",
                soonLabel: "Soon",
                pills: ["VAT", "Savings", "Mortgage", "EV Cost", "BMI"]
            }
        };

        const bentoCategories = [
            {
                id: "financien",
                span: "lg:col-span-2",
                cardBg: "bg-white",
                headerBg: "bg-gradient-to-r from-emerald-50 to-teal-50/60 border-emerald-100",
                badgeColor: "text-emerald-700 bg-emerald-100/80",
                hoverText: "group-hover:text-emerald-700",
                title: { nl: "Sparen, Lenen & Vastgoed", fr: "Épargne, Prêt & Immobilier", en: "Savings, Loans & Property" },
                subtitle: { nl: "Vermogensgroei, woonleningen en aankoopkosten", fr: "Croissance du capital, prêts et frais d'achat", en: "Wealth growth, mortgages and closing costs" },
                // Custom SVG Illustratie: Groeigrafiek & Huis
                illustration: `
                    <svg viewBox="0 0 120 80" class="w-28 h-20 shrink-0" fill="none">
                        <rect x="8" y="44" width="14" height="28" rx="4" fill="#A7F3D0"/>
                        <rect x="28" y="32" width="14" height="40" rx="4" fill="#6EE7B7"/>
                        <rect x="48" y="18" width="14" height="54" rx="4" fill="#10B981"/>
                        <path d="M14 38L34 24L54 12" stroke="#047857" stroke-width="3" stroke-linecap="round"/>
                        <circle cx="54" cy="12" r="4" fill="#047857"/>
                        <path d="M74 42L94 26L114 42V72H74V42Z" fill="#D1FAE5" stroke="#059669" stroke-width="2.5" stroke-linejoin="round"/>
                        <rect x="89" y="52" width="10" height="20" rx="2" fill="#059669"/>
                    </svg>`,
                links: [
                    { file: "hypotheek.html", label: { nl: "Hypotheek & Woonlening", fr: "Prêt Hypothécaire", en: "Mortgage & Loan Calculator" }, tag: "BE • NL" },
                    { file: "sparen.html", label: { nl: "Sparen & Beleggen (Netto)", fr: "Épargne & Intérêts Composés", en: "Compound Interest & Savings" }, tag: "BE • NL" },
                    { file: "registratierechten.html", label: { nl: "Registratierechten & Notaris", fr: "Droits d'enregistrement", en: "Property Transfer Tax" }, tag: "BE • NL" },
                    { file: "inflatie.html", label: { nl: "Inflatie & Koopkracht", fr: "Inflation & Pouvoir d'achat", en: "Inflation Calculator" }, tag: "2026" }
                ]
            },
            {
                id: "werk-btw",
                span: "lg:col-span-1",
                cardBg: "bg-white",
                headerBg: "bg-gradient-to-r from-blue-50 to-indigo-50/60 border-blue-100",
                badgeColor: "text-blue-700 bg-blue-100/80",
                hoverText: "group-hover:text-blue-700",
                title: { nl: "Werk, Loon & Btw", fr: "Travail, Salaire & TVA", en: "Work, Income & Tax" },
                subtitle: { nl: "Uren, bijverdienste en belasting", fr: "Heures, revenus et TVA", en: "Hours, wages and sales tax" },
                // Custom SVG Illustratie: Klok & Factuur
                illustration: `
                    <svg viewBox="0 0 96 80" class="w-24 h-20 shrink-0" fill="none">
                        <rect x="10" y="12" width="44" height="56" rx="8" fill="#DBEAFE" stroke="#2563EB" stroke-width="2.5"/>
                        <line x1="20" y1="26" x2="44" y2="26" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="20" y1="36" x2="38" y2="36" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
                        <line x1="20" y1="46" x2="42" y2="46" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round"/>
                        <circle cx="66" cy="48" r="20" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="2.5"/>
                        <path d="M66 38V48L73 52" stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>`,
                links: [
                    { file: "werkuren.html", label: { nl: "Werkuren & Uurloon", fr: "Heures & Salaire Horaire", en: "Work Hours & Pay" } },
                    { file: "flexijob.html", label: { nl: "Flexi-job Loon", fr: "Salaire Flexi-job", en: "Flexi-job Salary" }, tag: "BE" },
                    { file: "btw.html", label: { nl: "BTW Calculator", fr: "Calculateur TVA", en: "VAT / Sales Tax" }, tag: "BE•NL•LU" },
                    { file: "procenten.html", label: { nl: "Procenten & Winstmarge", fr: "Pourcentage & Marge", en: "Percentage & Margin" } }
                ]
            },
            {
                id: "wonen",
                span: "lg:col-span-1",
                cardBg: "bg-white",
                headerBg: "bg-gradient-to-r from-amber-50 to-orange-50/60 border-amber-100",
                badgeColor: "text-amber-800 bg-amber-100/80",
                hoverText: "group-hover:text-amber-700",
                title: { nl: "Wonen & Energie", fr: "Maison & Énergie", en: "Home & Energy" },
                subtitle: { nl: "Oppervlakte, stroom en zonne-energie", fr: "Surface, électricité et solaire", en: "Area, electricity and solar ROI" },
                // Custom SVG Illustratie: Zon & Plattegrond
                illustration: `
                    <svg viewBox="0 0 96 80" class="w-24 h-20 shrink-0" fill="none">
                        <circle cx="68" cy="24" r="12" fill="#FDE68A" stroke="#D97706" stroke-width="2.5"/>
                        <rect x="12" y="28" width="46" height="40" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-width="2.5"/>
                        <path d="M12 46H36V68" stroke="#F59E0B" stroke-width="2" stroke-dasharray="3 3"/>
                        <path d="M22 20H48" stroke="#B45309" stroke-width="2" stroke-linecap="round"/>
                    </svg>`,
                links: [
                    { file: "oppervlakte.html", label: { nl: "Oppervlakte & Omtrek (m²)", fr: "Surface & Périmètre (m²)", en: "Square Meter (m²) Area" } },
                    { file: "energie.html", label: { nl: "Stroomverbruik & Kosten", fr: "Consommation Électrique", en: "Electricity Cost (kWh)" } },
                    { file: "zonnepanelen.html", label: { nl: "Zonnepanelen Rendement", fr: "Rentabilité Panneaux Solaires", en: "Solar Panel Payback" } }
                ]
            },
            {
                id: "auto",
                span: "lg:col-span-1",
                cardBg: "bg-white",
                headerBg: "bg-gradient-to-r from-indigo-50 to-violet-50/60 border-indigo-100",
                badgeColor: "text-indigo-700 bg-indigo-100/80",
                hoverText: "group-hover:text-indigo-700",
                title: { nl: "Auto & Mobiliteit", fr: "Auto & Mobilité", en: "Auto & Mobility" },
                subtitle: { nl: "EV laden, brandstof en autobelasting", fr: "Recharge VE, carburant et taxes", en: "EV charging, fuel and vehicle tax" },
                // Custom SVG Illustratie: Elektrische stekker & weg
                illustration: `
                    <svg viewBox="0 0 96 80" class="w-24 h-20 shrink-0" fill="none">
                        <rect x="14" y="26" width="52" height="32" rx="10" fill="#E0E7FF" stroke="#4338CA" stroke-width="2.5"/>
                        <circle cx="28" cy="58" r="7" fill="#4338CA"/>
                        <circle cx="54" cy="58" r="7" fill="#4338CA"/>
                        <path d="M74 22V38M82 22V38M70 34H86V44C86 48.4 82.4 52 78 52C73.6 52 70 48.4 70 44V34Z" stroke="#4F46E5" stroke-width="2.5" stroke-linecap="round"/>
                    </svg>`,
                links: [
                    { file: "laadkosten.html", label: { nl: "Laadkosten EV vs. Benzine", fr: "Recharge VE vs Essence", en: "EV Charging vs. Gas" } },
                    { file: "ritkosten.html", label: { nl: "Brandstofkosten per Rit", fr: "Coût Carburant Trajet", en: "Fuel Trip Cost" } },
                    { file: "autobelasting.html", label: { nl: "Autobelasting (BIV / BPM)", fr: "Taxe Auto (TMC / BPM)", en: "Vehicle Tax (BE & NL)" }, tag: "BE • NL" }
                ]
            },
            {
                id: "gezondheid",
                span: "lg:col-span-1",
                cardBg: "bg-white",
                headerBg: "bg-gradient-to-r from-rose-50 to-pink-50/60 border-rose-100",
                badgeColor: "text-rose-700 bg-rose-100/80",
                hoverText: "group-hover:text-rose-700",
                title: { nl: "Gezondheid & Sport", fr: "Santé & Sport", en: "Health & Fitness" },
                subtitle: { nl: "Gezond gewicht, energiebehoefte en conditie", fr: "Poids idéal, calories et forme", en: "Healthy weight, calories and fitness" },
                // Custom SVG Illustratie: Hartslag & Schaal
                illustration: `
                    <svg viewBox="0 0 96 80" class="w-24 h-20 shrink-0" fill="none">
                        <rect x="14" y="16" width="68" height="48" rx="14" fill="#FFE4E6" stroke="#E11D48" stroke-width="2.5"/>
                        <path d="M24 42H36L42 28L50 54L56 38H72" stroke="#E11D48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>`,
                links: [
                    { file: "bmi.html", label: { nl: "BMI & Caloriebehoefte", fr: "Calculateur IMC & Calories", en: "BMI & Calorie Calculator" } }
                ]
            }
        ];

        function quickSearch(term) {
            const inp = document.getElementById("search-input");
            inp.value = term;
            renderBento();
        }

        function renderBento() {
            const lang = localStorage.getItem("rekenhub_lang") || "nl";
            const copy = pageCopy[lang] || pageCopy.nl;

            document.getElementById("hero-badge").textContent = copy.badge;
            document.getElementById("hero-title").textContent = copy.title;
            document.getElementById("hero-subtitle").textContent = copy.subtitle;
            document.getElementById("search-input").placeholder = copy.placeholder;
            document.getElementById("no-results-text").textContent = copy.noResults;
            document.getElementById("reset-search-btn").textContent = copy.resetBtn;

            document.getElementById("quick-pills").innerHTML = copy.pills.map(p =>
                `<button type="button" onclick="quickSearch('${p.split(' ')[0]}')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-blue-50 hover:text-blue-600 transition">${p}</button>`
            ).join("");

            const q = document.getElementById("search-input").value.toLowerCase().trim();
            const grid = document.getElementById("bento-grid");
            let totalVisible = 0;

            grid.innerHTML = bentoCategories.map(cat => {
                const matched = cat.links.filter(l =>
                    !q ||
                    l.label[lang].toLowerCase().includes(q) ||
                    l.label.nl.toLowerCase().includes(q) ||
                    l.label.en.toLowerCase().includes(q) ||
                    cat.title[lang].toLowerCase().includes(q)
                );

                if (matched.length === 0) return "";
                totalVisible += matched.length;

                return `
                    <section id="${cat.id}" class="${cat.span} ${cat.cardBg} rounded-3xl border border-slate-200/90 shadow-2xs overflow-hidden flex flex-col">
                        <div class="${cat.headerBg} border-b p-5 sm:p-6 flex items-center justify-between gap-4">
                            <div>
                                <h2 class="font-heading text-lg sm:text-xl font-bold text-slate-900">${cat.title[lang]}</h2>
                                <p class="text-xs text-slate-600 mt-1">${cat.subtitle[lang]}</p>
                            </div>
                            ${cat.illustration}
                        </div>

                        <div class="p-4 sm:p-5 grid grid-cols-1 ${cat.span.includes('col-span-2') ? 'sm:grid-cols-2' : ''} gap-2.5 flex-grow content-start">
                            ${matched.map(link => `
                                <a href="${link.file}" class="group flex items-center justify-between gap-2 px-3.5 py-2.5 rounded-xl bg-slate-50/70 hover:bg-slate-100/90 border border-transparent hover:border-slate-200 transition">
                                    <span class="text-sm font-semibold text-slate-800 ${cat.hoverText} transition truncate">${link.label[lang]}</span>
                                    <div class="flex items-center gap-2 shrink-0">
                                        ${link.tag ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-md ${cat.badgeColor}">${link.tag}</span>` : ''}
                                        <span class="text-slate-400 group-hover:translate-x-0.5 transition text-xs font-bold">→</span>
                                    </div>
                                </a>
                            `).join("")}
                        </div>
                    </section>
                `;
            }).join("");

            document.getElementById("no-results").classList.toggle("hidden", totalVisible > 0);
        }

        renderBento();
    </script>
</body>
</html>
