<!DOCTYPE html>
<html lang="nl" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RekenHub – Online Calculators (NL / FR / EN)</title>
    <meta name="description" content="Gratis online calculators voor financiën, wonen, energie, auto en gezondheid in België, Nederland en Luxemburg. Beschikbaar in Nederlands, Frans en Engels.">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #ffffff; color: #0f172a; }
        section { scroll-margin-top: 90px; }
    </style>
</head>
<body class="flex flex-col min-h-screen antialiased">
    <div id="app-header"></div>

    <main class="max-w-6xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 flex-grow space-y-12">

        <!-- Hero + Zoekbalk -->
        <div class="text-center max-w-2xl mx-auto space-y-4">
            <h1 id="hero-title" class="font-heading text-3xl sm:text-4xl font-bold text-slate-900">
                Gratis Online Calculators
            </h1>
            <p id="hero-subtitle" class="text-slate-500 text-base">
                Snel, nauwkeurig en gratis rekenen voor België, Nederland en Luxemburg. Kies een categorie hieronder.
            </p>
            <div class="relative max-w-md mx-auto pt-1">
                <input type="text" id="search-input" onkeyup="renderPortal()" placeholder="Zoek een calculator (bijv. btw, hypotheek, BMI)..." class="w-full rounded-full border border-slate-300 bg-slate-50/70 focus:bg-white pl-11 pr-5 py-3 text-sm font-medium text-slate-800 shadow-2xs focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition">
                <svg class="w-4 h-4 text-slate-400 absolute left-4 top-4.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </div>
        </div>

        <!-- 4 Kolommen met Ronde Thema-afbeeldingen (zoals op de screenshot) -->
        <div id="portal-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8 pt-2"></div>

        <!-- Geen resultaten -->
        <div id="no-results" class="hidden text-center py-12 bg-slate-50 rounded-2xl border border-slate-200">
            <p id="no-results-text" class="font-semibold text-slate-700">Geen calculator gevonden.</p>
            <button id="reset-search-btn" onclick="document.getElementById('search-input').value=''; renderPortal();" class="mt-2 text-sm font-bold text-blue-600 hover:underline">Toon alle calculators</button>
        </div>

    </main>

    <div id="app-footer"></div>
    <script src="layout.js"></script>
    <script>
        const pageCopy = {
            nl: {
                title: "Gratis Online Calculators",
                subtitle: "Snel, nauwkeurig en gratis rekenen voor België, Nederland en Luxemburg. Kies een calculator hieronder.",
                placeholder: "Zoek een calculator (bijv. btw, hypotheek, BMI)...",
                noResults: "Geen calculator gevonden voor deze zoekterm.",
                resetBtn: "Toon alle 15 calculators"
            },
            fr: {
                title: "Calculateurs en Ligne Gratuits",
                subtitle: "Calculs rapides et précis pour la Belgique, les Pays-Bas et le Luxembourg. Choisissez un outil ci-dessous.",
                placeholder: "Rechercher un calculateur (ex. TVA, prêt, IMC)...",
                noResults: "Aucun calculateur trouvé pour cette recherche.",
                resetBtn: "Afficher les 15 calculateurs"
            },
            en: {
                title: "Free Online Calculators",
                subtitle: "Fast, accurate calculators for finance, home, energy, auto, and health. Select a calculator below.",
                placeholder: "Search a calculator (e.g. VAT, mortgage, BMI)...",
                noResults: "No calculator found matching your search.",
                resetBtn: "Show all 15 calculators"
            }
        };

        const portalColumns = [
            {
                id: "financien",
                titleColor: "text-emerald-700",
                ringColor: "ring-emerald-100",
                image: "https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=400&q=80",
                title: { nl: "Financiën & Vastgoed", fr: "Finances & Immobilier", en: "Financial Calculators" },
                links: [
                    { file: "hypotheek.html", label: { nl: "Hypotheek Calculator", fr: "Calculateur Prêt Hypothécaire", en: "Mortgage Calculator" } },
                    { file: "sparen.html", label: { nl: "Sparen & Beleggen", fr: "Épargne & Intérêts Composés", en: "Compound Interest & Savings" } },
                    { file: "btw.html", label: { nl: "BTW Calculator", fr: "Calculateur TVA", en: "VAT / Sales Tax Calculator" } },
                    { file: "registratierechten.html", label: { nl: "Registratierechten & Notaris", fr: "Droits d'enregistrement", en: "Property Transfer Tax" } },
                    { file: "flexijob.html", label: { nl: "Flexi-job Loon (BE)", fr: "Salaire Flexi-job (BE)", en: "Flexi-job Salary (BE)" } },
                    { file: "inflatie.html", label: { nl: "Inflatie & Koopkracht", fr: "Calculateur d'Inflation", en: "Inflation Calculator" } }
                ]
            },
            {
                id: "gezondheid",
                titleColor: "text-sky-700",
                ringColor: "ring-sky-100",
                image: "https://images.unsplash.com/photo-1517836357463-d25dfeac3438?auto=format&fit=crop&w=400&q=80",
                title: { nl: "Gezondheid & Dagelijks", fr: "Santé & Quotidien", en: "Fitness & Health Calculators" },
                links: [
                    { file: "bmi.html", label: { nl: "BMI & Caloriebehoefte", fr: "Calculateur IMC & Calories", en: "BMI & Calorie Calculator" } },
                    { file: "werkuren.html", label: { nl: "Werkuren & Uurloon", fr: "Heures de Travail & Salaire", en: "Work Hours & Pay Calculator" } },
                    { file: "procenten.html", label: { nl: "Procenten & Korting", fr: "Pourcentage & Remise", en: "Percentage & Discount" } }
                ]
            },
            {
                id: "wonen",
                titleColor: "text-amber-700",
                ringColor: "ring-amber-100",
                image: "https://images.unsplash.com/photo-1503387762-592deb58ef4e?auto=format&fit=crop&w=400&q=80",
                title: { nl: "Wonen, Klussen & Energie", fr: "Maison, Travaux & Énergie", en: "Home & Energy Calculators" },
                links: [
                    { file: "oppervlakte.html", label: { nl: "Oppervlakte & Omtrek (m²)", fr: "Surface & Périmètre (m²)", en: "Square Meter (m²) Area" } },
                    { file: "energie.html", label: { nl: "Stroomverbruik & Kosten (kWh)", fr: "Consommation Électrique (kWh)", en: "Electricity Cost (kWh)" } },
                    { file: "zonnepanelen.html", label: { nl: "Zonnepanelen Terugverdientijd", fr: "Rentabilité Panneaux Solaires", en: "Solar Panel Payback" } }
                ]
            },
            {
                id: "auto",
                titleColor: "text-indigo-700",
                ringColor: "ring-indigo-100",
                image: "https://images.unsplash.com/photo-1593941707882-a5bba14938c7?auto=format&fit=crop&w=400&q=80",
                title: { nl: "Auto & Mobiliteit", fr: "Auto & Mobilité", en: "Auto & Fuel Calculators" },
                links: [
                    { file: "laadkosten.html", label: { nl: "Laadkosten EV vs. Benzine", fr: "Recharge VE vs Essence", en: "EV Charging vs. Gas Cost" } },
                    { file: "ritkosten.html", label: { nl: "Brandstofkosten per Rit", fr: "Coût Carburant par Trajet", en: "Fuel Trip Cost Calculator" } },
                    { file: "autobelasting.html", label: { nl: "Autobelasting (BIV / BPM)", fr: "Taxe Auto (TMC / BPM)", en: "Vehicle Registration Tax" } }
                ]
            }
        ];

        function renderPortal() {
            const lang = localStorage.getItem("rekenhub_lang") || "nl";
            const copy = pageCopy[lang] || pageCopy.nl;

            document.getElementById("hero-title").textContent = copy.title;
            document.getElementById("hero-subtitle").textContent = copy.subtitle;
            document.getElementById("search-input").placeholder = copy.placeholder;
            document.getElementById("no-results-text").textContent = copy.noResults;
            document.getElementById("reset-search-btn").textContent = copy.resetBtn;

            const q = document.getElementById("search-input").value.toLowerCase().trim();
            const grid = document.getElementById("portal-grid");
            let totalVisible = 0;

            grid.innerHTML = portalColumns.map(col => {
                const matched = col.links.filter(l =>
                    !q ||
                    l.label[lang].toLowerCase().includes(q) ||
                    l.label.nl.toLowerCase().includes(q) ||
                    l.label.en.toLowerCase().includes(q) ||
                    col.title[lang].toLowerCase().includes(q)
                );

                if (matched.length === 0) return "";
                totalVisible += matched.length;

                return `
                    <section id="${col.id}" class="flex flex-col items-center text-center sm:items-start sm:text-left">
                        <a href="#${col.id}" class="group mb-4 self-center">
                            <div class="w-32 h-32 rounded-full overflow-hidden ring-4 ${col.ringColor} shadow-sm group-hover:scale-105 transition duration-200">
                                <img src="${col.image}" alt="${col.title[lang]}" loading="lazy" class="w-full h-full object-cover">
                            </div>
                        </a>

                        <h2 class="font-heading text-lg font-bold ${col.titleColor} mb-3 self-center sm:self-start">
                            ${col.title[lang]}
                        </h2>

                        <ul class="space-y-2 w-full">
                            ${matched.map(link => `
                                <li>
                                    <a href="${link.file}" class="text-sm font-medium text-blue-700 hover:text-blue-900 hover:underline transition block py-0.5">
                                        ${link.label[lang]}
                                    </a>
                                </li>
                            `).join("")}
                        </ul>
                    </section>
                `;
            }).join("");

            document.getElementById("no-results").classList.toggle("hidden", totalVisible > 0);
        }

        renderPortal();
    </script>
</body>
</html>
