<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact, Fout Melden & Suggesties – RekenHub</title>
    <meta name="description" content="Heb je een fout ontdekt in een tarief, wil je een nieuwe calculator aanvragen of heb je een vraag? Stuur ons direct een bericht via het formulier.">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900 flex flex-col min-h-screen antialiased">
    <div id="app-header"></div>

    <main class="max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 flex-grow">
        <div class="bg-white rounded-3xl p-6 sm:p-10 border border-slate-200/90 shadow-2xs space-y-6">
            <div>
                <span id="c-badge" class="inline-block text-xs font-bold uppercase tracking-wider text-blue-700 bg-blue-50 border border-blue-200 px-3 py-1 rounded-full mb-2">
                    Contact & Feedback
                </span>
                <h1 id="c-title" class="font-heading text-3xl sm:text-4xl font-bold text-slate-900">
                    Neem contact op
                </h1>
                <p id="c-subtitle" class="text-slate-600 text-sm sm:text-base mt-2">
                    Heb je een foutje ontdekt in een berekening of tarief, wil je een nieuwe calculator aanvragen of heb je een vraag? Vul het formulier hieronder in.
                </p>
            </div>

            <form id="contact-form" onsubmit="submitContactForm(event)" class="space-y-4">
                <!-- Vervang onderstaande waarde straks door je gratis Web3Forms Access Key (via web3forms.com) -->
                <input type="hidden" id="web3-key" name="access_key" value="JOUW_WEB3FORMS_KEY_HIER">
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label id="lbl-name" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Jouw naam</label>
                        <input type="text" id="contact-name" name="name" required placeholder="Jan Janssens" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label id="lbl-email" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Jouw e-mailadres (voor reactie)</label>
                        <input type="email" id="contact-reply" name="email" required placeholder="naam@voorbeeld.be" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                </div>

                <div>
                    <label id="lbl-subject" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Onderwerp</label>
                    <select id="contact-subject" name="subject" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 text-sm font-medium bg-white focus:ring-2 focus:ring-blue-500 outline-none"></select>
                </div>

                <div>
                    <label id="lbl-msg" class="block text-xs font-bold uppercase tracking-wider text-slate-500 mb-1.5">Je bericht</label>
                    <textarea id="contact-msg" name="message" rows="5" required placeholder="Beschrijf hier zo duidelijk mogelijk je vraag, suggestie of de gevonden fout..." class="w-full rounded-xl border border-slate-300 p-4 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button type="submit" id="btn-submit" class="px-6 py-3 rounded-xl bg-slate-900 hover:bg-blue-600 text-white font-bold text-sm transition">
                    Bericht versturen →
                </button>
            </form>

            <div id="form-feedback" class="hidden rounded-2xl p-4 text-sm font-semibold"></div>
        </div>
    </main>

    <div id="app-footer"></div>
    <script src="layout.js"></script>
    <script>
        const contactCopy = {
            nl: {
                badge: "Contact & Feedback",
                title: "Neem contact op",
                subtitle: "Heb je een foutje ontdekt in een berekening of tarief, wil je een nieuwe calculator aanvragen of heb je een vraag? Vul het formulier hieronder in.",
                lblName: "Jouw naam",
                phName: "Jan Janssens",
                lblEmail: "Jouw e-mailadres (voor reactie)",
                phEmail: "naam@voorbeeld.be",
                lblSubject: "Onderwerp",
                subjects: [
                    "Fout in berekening of tarief melden",
                    "Suggestie voor een nieuwe calculator",
                    "Technische fout op de website melden",
                    "Samenwerking / Adverteren",
                    "Overige vraag"
                ],
                lblMsg: "Je bericht",
                phMsg: "Beschrijf hier zo duidelijk mogelijk je vraag, suggestie of de gevonden fout...",
                btnSend: "Bericht versturen →",
                btnSending: "Bezig met verzenden...",
                successMsg: "✓ Bedankt! Je bericht is verzonden. We bekijken het zo snel mogelijk.",
                setupMsg: "✓ Formulier gecontroleerd! Vul straks in contact.html jouw gratis Web3Forms-sleutel in (via web3forms.com) om berichten rechtstreeks in je eigen inbox te ontvangen.",
                errorMsg: "Er ging iets mis bij het verzenden. Probeer het later opnieuw."
            },
            fr: {
                badge: "Contact & Retours",
                title: "Contactez-nous",
                subtitle: "Vous avez repéré une erreur dans un calcul ou un barème, vous souhaitez suggérer un nouveau calculateur ou poser une question ? Remplissez le formulaire ci-dessous.",
                lblName: "Votre nom",
                phName: "Jean Dupont",
                lblEmail: "Votre adresse e-mail (pour réponse)",
                phEmail: "nom@exemple.be",
                lblSubject: "Sujet",
                subjects: [
                    "Signaler une erreur de calcul ou de barème",
                    "Suggérer un nouveau calculateur",
                    "Signaler un problème technique sur le site",
                    "Partenariat / Publicité",
                    "Autre question"
                ],
                lblMsg: "Votre message",
                phMsg: "Décrivez ici votre question, suggestion ou l'erreur constatée...",
                btnSend: "Envoyer le message →",
                btnSending: "Envoi en cours...",
                successMsg: "✓ Merci ! Votre message a bien été envoyé. Nous l'examinerons rapidement.",
                setupMsg: "✓ Formulaire prêt ! Ajoutez votre clé gratuite Web3Forms dans contact.html pour recevoir les messages dans votre boîte mail.",
                errorMsg: "Une erreur s'est produite lors de l'envoi. Veuillez réessayer plus tard."
            },
            en: {
                badge: "Contact & Feedback",
                title: "Get in Touch",
                subtitle: "Found an error in a calculation or tax rate, want to request a new calculator, or have a general question? Send us a message using the form below.",
                lblName: "Your name",
                phName: "John Doe",
                lblEmail: "Your email address (for reply)",
                phEmail: "name@example.com",
                lblSubject: "Subject",
                subjects: [
                    "Report an error in a calculation or tax rate",
                    "Suggest a new calculator",
                    "Report a technical issue on the website",
                    "Partnership / Advertising",
                    "Other question"
                ],
                lblMsg: "Your message",
                phMsg: "Describe your question, suggestion, or the issue you found...",
                btnSend: "Send message →",
                btnSending: "Sending...",
                successMsg: "✓ Thank you! Your message has been sent. We will review it shortly.",
                setupMsg: "✓ Form validated! Add your free Web3Forms access key in contact.html to receive messages directly in your inbox.",
                errorMsg: "Something went wrong while sending your message. Please try again later."
            }
        };

        function initContactLang() {
            const lang = localStorage.getItem("rekenhub_lang") || "nl";
            const c = contactCopy[lang] || contactCopy.nl;

            document.getElementById("c-badge").textContent = c.badge;
            document.getElementById("c-title").textContent = c.title;
            document.getElementById("c-subtitle").textContent = c.subtitle;
            document.getElementById("lbl-name").textContent = c.lblName;
            document.getElementById("contact-name").placeholder = c.phName;
            document.getElementById("lbl-email").textContent = c.lblEmail;
            document.getElementById("contact-reply").placeholder = c.phEmail;
            document.getElementById("lbl-subject").textContent = c.lblSubject;
            document.getElementById("lbl-msg").textContent = c.lblMsg;
            document.getElementById("contact-msg").placeholder = c.phMsg;
            document.getElementById("btn-submit").textContent = c.btnSend;

            const sel = document.getElementById("contact-subject");
            sel.innerHTML = c.subjects.map(s => `<option value="${s}">${s}</option>`).join("");
        }

        async function submitContactForm(e) {
            e.preventDefault();
            const lang = localStorage.getItem("rekenhub_lang") || "nl";
            const c = contactCopy[lang] || contactCopy.nl;
            const btn = document.getElementById("btn-submit");
            const box = document.getElementById("form-feedback");
            const key = document.getElementById("web3-key").value;

            if (!key || key === "JOUW_WEB3FORMS_KEY_HIER") {
                box.className = "rounded-2xl p-4 text-sm font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200";
                box.textContent = c.setupMsg;
                box.classList.remove("hidden");
                return;
            }

            btn.disabled = true;
            btn.textContent = c.btnSending;

            try {
                const formData = new FormData(document.getElementById("contact-form"));
                const res = await fetch("https://api.web3forms.com/submit", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                if (data.success) {
                    box.className = "rounded-2xl p-4 text-sm font-semibold bg-emerald-50 text-emerald-800 border border-emerald-200";
                    box.textContent = c.successMsg;
                    document.getElementById("contact-form").reset();
                } else {
                    throw new Error("Submit failed");
                }
            } catch (err) {
                box.className = "rounded-2xl p-4 text-sm font-semibold bg-rose-50 text-rose-800 border border-rose-200";
                box.textContent = c.errorMsg;
            } finally {
                box.classList.remove("hidden");
                btn.disabled = false;
                btn.textContent = c.btnSend;
            }
        }

        initContactLang();
    </script>
</body>
</html>
