<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – RekenHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7fa; color: #0f172a; }</style>
</head>
<body class="flex flex-col min-h-screen antialiased">
    <div id="app-header"></div>
    <main class="max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 flex-grow">
        <div class="bg-white rounded-2xl p-6 sm:p-10 shadow-sm border border-slate-200/80 space-y-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Contact & Suggesties</h1>
                <p class="text-slate-600">Heb je een foutje ontdekt in een formule of mis je een handige calculator? Laat het ons weten.</p>
            </div>
            <form onsubmit="event.preventDefault(); document.getElementById('sent-msg').classList.remove('hidden');" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Naam</label>
                    <input type="text" required class="w-full rounded-xl border-slate-300 border px-4 py-2.5">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">E-mailadres</label>
                    <input type="email" required class="w-full rounded-xl border-slate-300 border px-4 py-2.5">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Bericht</label>
                    <textarea rows="4" required class="w-full rounded-xl border-slate-300 border px-4 py-2.5"></textarea>
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl transition">Versturen</button>
                <p id="sent-msg" class="hidden text-sm font-semibold text-emerald-600 bg-emerald-50 p-3 rounded-xl border border-emerald-200">Bedankt voor je bericht! We bekijken je suggestie zo snel mogelijk.</p>
            </form>
        </div>
    </main>
    <div id="app-footer"></div>
    <script src="layout.js"></script>
</body>
</html>
