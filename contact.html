<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact – RekenHub Benelux</title>
    <meta name="description" content="Neem contact op met RekenHub voor vragen, suggesties voor nieuwe calculators of meldingen.">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7fa; color: #0f172a; }</style>
</head>
<body class="flex flex-col min-h-screen antialiased">
    <div id="app-header"></div>
    <main class="max-w-3xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-10 flex-grow">
        <div class="bg-white rounded-2xl p-6 sm:p-10 shadow-sm border border-slate-200/80 space-y-6">
            <div>
                <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Contact & Suggesties</h1>
                <p class="text-slate-600">Heb je een foutje ontdekt in een formule of mis je een handige calculator voor België, Nederland of Luxemburg? Laat het ons weten.</p>
            </div>

            <form id="contact-form" action="https://api.web3forms.com/submit" method="POST" class="space-y-4">
                <input type="hidden" name="access_key" value="ee35ba3d-87ca-4c31-b287-2218e0c3ed75">
                <input type="hidden" name="subject" value="Nieuw bericht via RekenHub.com">
                <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Naam</label>
                    <input type="text" name="name" required placeholder="Jouw naam" class="w-full rounded-xl border-slate-300 border px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">E-mailadres</label>
                    <input type="email" name="email" required placeholder="naam@voorbeeld.be" class="w-full rounded-xl border-slate-300 border px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Bericht</label>
                    <textarea name="message" rows="4" required placeholder="Waarmee kunnen we je helpen?" class="w-full rounded-xl border-slate-300 border px-4 py-2.5 focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
                </div>

                <button type="submit" id="submit-btn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-3 rounded-xl transition">Versturen</button>

                <div id="form-result" class="hidden text-sm font-semibold p-4 rounded-xl border"></div>
            </form>
        </div>
    </main>
    <div id="app-footer"></div>
    <script src="layout.js"></script>
    <script>
        const form = document.getElementById('contact-form');
        const result = document.getElementById('form-result');
        const btn = document.getElementById('submit-btn');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            btn.disabled = true;
            btn.textContent = 'Bezig met versturen...';
            result.classList.add('hidden');

            const formData = new FormData(form);
            const object = Object.fromEntries(formData);
            const json = JSON.stringify(object);

            try {
                const response = await fetch('https://api.web3forms.com/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: json
                });
                const data = await response.json();
                result.classList.remove('hidden');
                if (response.status === 200) {
                    result.className = 'text-sm font-semibold text-emerald-700 bg-emerald-50 p-4 rounded-xl border border-emerald-200';
                    result.textContent = 'Bedankt! Je bericht is succesvol verzonden. We nemen zo snel mogelijk contact op.';
                    form.reset();
                } else {
                    result.className = 'text-sm font-semibold text-rose-700 bg-rose-50 p-4 rounded-xl border border-rose-200';
                    result.textContent = data.message || 'Er ging iets mis bij het versturen. Probeer het opnieuw.';
                }
            } catch (error) {
                result.classList.remove('hidden');
                result.className = 'text-sm font-semibold text-rose-700 bg-rose-50 p-4 rounded-xl border border-rose-200';
                result.textContent = 'Netwerkfout. Controleer je internetverbinding en probeer het opnieuw.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Versturen';
            }
        });
    </script>
</body>
</html>
